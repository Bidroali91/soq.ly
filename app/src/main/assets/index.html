<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D1B2A" />
  <title>ميكرو نت</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ شاشة الاتصال ============ -->
<section id="screen-connect" class="screen active">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 48 48" width="56" height="56">
        <rect x="10" y="28" width="28" height="9" rx="2" fill="#F8FAFC"/>
        <circle cx="15" cy="32.5" r="1" fill="#22D3EE"/>
        <circle cx="19" cy="32.5" r="1" fill="#34D399"/>
        <circle cx="23" cy="32.5" r="1" fill="#FBBF24"/>
        <line x1="14" y1="28" x2="14" y2="18" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="34" y1="28" x2="34" y2="18" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="14" cy="17" r="1.6" fill="#22D3EE"/>
        <circle cx="34" cy="17" r="1.6" fill="#22D3EE"/>
        <path d="M24 14 a6 6 0 0 1 6 6" stroke="#22D3EE" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M24 10 a10 10 0 0 1 10 10" stroke="#67E8F9" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/>
      </svg>
    </div>
    <h1>ميكرو نت</h1>
    <p class="tag">إدارة شبكات MikroTik من هاتفك</p>
  </div>

  <form id="connect-form" class="card">
    <div class="conn-list" id="conn-list"></div>
    <label>إصدار RouterOS
      <select id="version">
        <option value="v7">الإصدار 7 (REST API)</option>
        <option value="v6" selected>الإصدار 6 (API)</option>
      </select>
    </label>
    <label>عنوان الراوتر (IP أو DDNS)
      <input id="host" type="text" placeholder="192.168.88.1" required autocomplete="off" />
    </label>
    <label>المنفذ (Port)
      <input id="port" type="text" inputmode="numeric" value="8728" />
    </label>
    <label>اسم المستخدم
      <input id="username" type="text" value="admin" autocomplete="username" />
    </label>
    <label>كلمة المرور
      <input id="password" type="password" autocomplete="current-password" />
    </label>
    <label class="row" id="https-row" hidden>
      <input id="https" type="checkbox" checked /> استخدام HTTPS
    </label>
    <label>اسم الحفظ (اختياري)
      <input id="conn-name" type="text" placeholder="مثلاً: راوتر المقهى" />
    </label>
    <div class="actions">
      <button class="primary" type="submit" id="btn-connect">اتصال</button>
    </div>
    <div id="connect-msg" class="msg"></div>
  </form>
</section>

<!-- ============ التطبيق الرئيسي ============ -->
<section id="screen-app" class="screen">
  <header class="topbar">
    <div>
      <div class="topbar-name" id="router-name">—</div>
      <div class="topbar-sub" id="router-sub">متصل</div>
    </div>
    <div class="topbar-actions">
      <button id="btn-refresh" title="تحديث">↻</button>
      <button id="btn-logout" title="قطع الاتصال">⏻</button>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottombar">
    <button class="nav-btn active" data-screen="overview">📊<span>نظرة عامة</span></button>
    <button class="nav-btn" data-screen="active">👥<span>متصلون</span></button>
    <button class="nav-btn" data-screen="vouchers">🎫<span>كروت</span></button>
    <button class="nav-btn" data-screen="users">👤<span>مستخدمون</span></button>
    <button class="nav-btn" data-screen="more">⋯<span>المزيد</span></button>
  </nav>
</section>

<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>

<script src="app.js"></script>
</body>
</html>
